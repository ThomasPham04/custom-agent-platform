[project]
name = "agent-platform-service"
version = "0.1.0"
# 3.14, matching python:3.14-slim in the Dockerfile. This is what makes the dev
# interpreter deterministic without a .python-version file: uv prefers its own
# managed interpreters over the system one, so a looser floor here lets it pick
# whatever older version it happens to have cached.
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "httpx>=0.27",
  # zoneinfo reads the *system* IANA database, which Windows has never had and
  # python:*-slim does not ship. current_time would fail on "UTC" itself
  # without this; the package is the fallback zoneinfo documents.
  "tzdata>=2024.1",
]

# google-adk is an optional extra, not a core dependency: nothing imports it in
# Phase 0, and a heavyweight resolver conflict must not block the skeleton.
[project.optional-dependencies]
adk = ["google-adk"]

# A dependency group, not an extra: uv installs groups on a plain `uv sync`, so
# the documented `uv run pytest` and `uv run ruff check .` work in a fresh
# checkout without anyone remembering `--extra dev`.
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Depends()/Query() in a parameter default is the FastAPI idiom, not the mutable
# default argument B008 exists to catch.
ignore = ["B008"]
