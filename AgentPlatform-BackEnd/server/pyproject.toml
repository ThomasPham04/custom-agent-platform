[project]
name = "agent-platform-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "httpx>=0.27",
]

# google-adk is an optional extra, not a core dependency: nothing imports it in
# Phase 0, and a heavyweight resolver conflict must not block the skeleton.
[project.optional-dependencies]
adk = ["google-adk"]

# A dependency group, not an extra: uv installs groups on a plain `uv sync`, so
# the documented `uv run pytest` and `uv run ruff check .` work in a fresh
# checkout without anyone remembering `--extra dev`.
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Depends()/Query() in a parameter default is the FastAPI idiom, not the mutable
# default argument B008 exists to catch.
ignore = ["B008"]
