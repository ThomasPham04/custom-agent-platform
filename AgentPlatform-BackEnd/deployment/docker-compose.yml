# Runs the proof of concept end to end. The API image is Python; a `db` service
# joins this file in Phase 2, at which point `api` gains a depends_on condition.
services:
  api:
    build:
      context: ../server
    env_file:
      - ./deploy/env/backend.env
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/api/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../../AgentPlatform-FrontEnd/client
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
