<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- Inlined so the page makes no network request for it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2337352F'/%3E%3Crect x='8' y='9' width='16' height='2.5' rx='1.25' fill='%23FFFFFF'/%3E%3Crect x='8' y='15' width='16' height='2.5' rx='1.25' fill='%23FFFFFF'/%3E%3Crect x='8' y='21' width='9' height='2.5' rx='1.25' fill='%239065B0'/%3E%3C/svg%3E"
    />
    <title>Agent Platform</title>
    <!--
      Link preview. Crawlers run no JavaScript and send no cookies, so these
      must be in the served HTML, and duplicated into public/login.html, where
      the gate redirects them. Keep the two copies equal.

      nginx rewrites the origin per request (sub_filter in nginx.conf), so the
      absolute URLs below need no hostname baked into the build.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agent Platform" />
    <meta property="og:title" content="Agent Platform" />
    <meta
      property="og:description"
      content="Create an agent, give it tools, and watch the trace — every tool call, its arguments, and how long it took."
    />
    <meta property="og:url" content="__OG_ORIGIN__/" />
    <meta property="og:image" content="__OG_ORIGIN__/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A question, the two tools the agent called with their durations, and the answer."
    />
    <!-- Promotes the card from thumbnail to the full-bleed 1200x630 crop. -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
