server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Emit relative Location headers. On by default, absolute_redirect rebuilds
  # the URL from $host and the listen port, which drops :8090 on the published
  # host port and — worse — hands a browser arriving over the tunnel an http://
  # redirect, because nginx sees Cloudflare's plaintext hop and not the TLS in
  # front of it. A relative Location keeps whatever scheme, host and port the
  # client actually used.
  absolute_redirect off;

  # $gate_ok comes from conf.d/gate.conf, rendered from WEB_PASSWORD at
  # container start. With no password configured it is always 1 and every
  # `if` below is a no-op.
  #
  # `if` is only safe in a location when its body is a bare return, which is
  # all it ever does here.

  # The two exemptions, and there are only two: the login page, and the
  # stylesheet it draws itself with. Everything else — the app shell, the
  # bundle, and the entire API — sits behind the cookie.
  location = /login.html {
  }

  location = /tokens.css {
  }

  # Reports are static files, but they are still behind the password gate. A
  # specific location keeps a missing report from falling back to React and
  # tells caches not to retain a copy that could bypass the cookie check.
  location /documents/ {
    if ($gate_ok = 0) {
      return 302 /login.html?next=$request_uri;
    }
    add_header Cache-Control "private, no-store, max-age=0" always;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths fall through to the app shell.
  location / {
    # $request_uri carries the query string, so a deep link survives the
    # round trip through the login page.
    if ($gate_ok = 0) {
      return 302 /login.html?next=$request_uri;
    }
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API, so the browser never needs CORS.
  location /api/ {
    # A 302 would be useless to fetch() — it follows the redirect and hands
    # the caller an HTML page where JSON was expected. This answers in the
    # error envelope lib/api-client.ts already parses, so a gated request
    # surfaces as a readable message instead of a parse failure.
    default_type application/json;
    if ($gate_ok = 0) {
      return 401 '{"error":{"code":"unauthorized","message":"Password required."}}';
    }

    proxy_pass http://api:4000/api/;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
