# The scheme the client actually used.
#
# Same problem absolute_redirect solves below, and the same cause: nginx
# terminates Cloudflare's plaintext hop, so $scheme is http even when the
# browser is on https. X-Forwarded-Proto carries the truth when there is a
# proxy in front, and is absent on a direct hit, which is when $scheme is
# already right. Only used to build the absolute og: URLs.
map $http_x_forwarded_proto $og_scheme {
  default  $scheme;
  http     http;
  https    https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Emit relative Location headers. On by default, absolute_redirect rebuilds
  # the URL from $host and the listen port, which drops :8090 on the published
  # host port and — worse — hands a browser arriving over the tunnel an http://
  # redirect, because nginx sees Cloudflare's plaintext hop and not the TLS in
  # front of it. A relative Location keeps whatever scheme, host and port the
  # client actually used.
  absolute_redirect off;

  # Resolve __OG_ORIGIN__ in the link-preview tags to the origin this request
  # arrived on, so one image serves localhost:8080 and the tunnel hostname
  # without either being baked into the build.
  #
  # $http_host, not $host: $host is the Host header with the port stripped,
  # which would point a crawler at localhost/og-card.png and 404.
  #
  # Declared at server level rather than per location because sub_filter only
  # ever touches text/html — its default, and left at its default — and the two
  # HTML files this server serves are exactly the two that carry the tags. The
  # PDF, the bundle and the API all declare other types and pass through
  # untouched. The cost is that nginx drops ETag and Last-Modified on those two
  # responses, since it can no longer vouch for a body it rewrote; index.html
  # is `no-store` anyway and login.html is 9 KB.
  sub_filter '__OG_ORIGIN__' '$og_scheme://$http_host';
  sub_filter_once off;

  # $gate_ok comes from conf.d/gate.conf, rendered from WEB_PASSWORD at
  # container start. With no password configured it is always 1 and every
  # `if` below is a no-op.
  #
  # `if` is only safe in a location when its body is a bare return, which is
  # all it ever does here.

  # The exemptions, and there are only three: the login page, the stylesheet it
  # draws itself with, and the link-preview card. Everything else — the app
  # shell, the bundle, and the entire API — sits behind the cookie.
  location = /login.html {
  }

  location = /tokens.css {
  }

  # Deliberately public, and it has to be. A link-preview crawler sends no
  # cookie, so a gated card is no card: Messenger would render a bare link.
  # This is the metadata surface the gate is chosen to have — the picture of a
  # run, not the run — and it leaks nothing the description in the tags does
  # not already say.
  #
  # A day, not a year: the filename is not content-hashed, so a long lifetime
  # would pin a regenerated card behind stale copies at the edge. `public`
  # rather than `private` is the point of the location.
  location = /og-card.png {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # The report, served from a path with no file extension.
  #
  # That is the whole point of this location and it is not cosmetic. Cloudflare
  # caches by URL extension and, for the extensions on its default list, does so
  # regardless of what the origin sends: the /documents/ block below has always
  # set `no-store`, and the edge cached the .pdf anyway and served it to clients
  # with no gate cookie at all — measured, not theorised. An extensionless URL
  # is treated as dynamic, so the headers below are honoured and the gate holds.
  #
  # Belt and braces: a Cloudflare Cache Rule on /documents/* set to Bypass is
  # still worth having, because this defends via a URL shape rather than a
  # stated policy.
  location = /report {
    if ($gate_ok = 0) {
      return 302 /login.html?next=$request_uri;
    }
    # nginx resolves the MIME type from the REQUEST extension, not the aliased
    # file, and /report has none. Without this the browser is handed a PDF
    # labelled text/plain and renders it as mojibake.
    default_type application/pdf;
    add_header Cache-Control "private, no-store, max-age=0" always;
    alias /usr/share/nginx/html/documents/ai-agent-platform-report.pdf;
  }

  # Kept for links that predate /report. Same gate, same headers — but the
  # extension means a shared cache may still retain a copy, which is exactly
  # why the sidebar no longer points here.
  location /documents/ {
    if ($gate_ok = 0) {
      return 302 /login.html?next=$request_uri;
    }
    add_header Cache-Control "private, no-store, max-age=0" always;
    try_files $uri =404;
  }

  # Hashed filenames, so the content behind one can never change: a year is the
  # honest answer, and `immutable` stops the browser revalidating on reload.
  #
  # `private` rather than `public` because the bundle is meant to sit behind the
  # gate like everything else. Be aware that Cloudflare disregards this for .js
  # and .css the same way it did for .pdf, so at the edge the bundle is public
  # in practice. That is a Cache Rule's job to fix, not a header's.
  location /assets/ {
    if ($gate_ok = 0) {
      return 302 /login.html?next=$request_uri;
    }
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths fall through to the app shell.
  location / {
    # $request_uri carries the query string, so a deep link survives the
    # round trip through the login page.
    if ($gate_ok = 0) {
      return 302 /login.html?next=$request_uri;
    }
    # index.html names the hashed bundle, so caching it pins the whole app to
    # one deploy. A browser that heuristically cached it (nginx sent no
    # Cache-Control here at all) kept requesting a bundle no longer in the
    # image, and Cloudflare's edge kept answering 200 from its own cache — the
    # user saw the previous release until a manual hard reload. The redirect
    # above is covered too: a cached 302 outlives the cookie that clears it.
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API, so the browser never needs CORS.
  location /api/ {
    # A 302 would be useless to fetch() — it follows the redirect and hands
    # the caller an HTML page where JSON was expected. This answers in the
    # error envelope lib/api-client.ts already parses, so a gated request
    # surfaces as a readable message instead of a parse failure.
    default_type application/json;
    if ($gate_ok = 0) {
      return 401 '{"error":{"code":"unauthorized","message":"Password required."}}';
    }

    proxy_pass http://api:4000/api/;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
