name: Sync platform report PDF

on:
  push:
    paths:
      - documents/ai-agent-platform-report.pdf
      - .github/workflows/sync-report-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync the report into Vite's public directory
        run: |
          mkdir -p AgentPlatform-FrontEnd/client/public/documents
          cp documents/ai-agent-platform-report.pdf \
            AgentPlatform-FrontEnd/client/public/documents/ai-agent-platform-report.pdf

      - name: Commit the generated public copy
        run: |
          if git diff --quiet -- AgentPlatform-FrontEnd/client/public/documents/ai-agent-platform-report.pdf; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPlatform-FrontEnd/client/public/documents/ai-agent-platform-report.pdf
          git commit -m "chore: sync platform report PDF"
          git push
